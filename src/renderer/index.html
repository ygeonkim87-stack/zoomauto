<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<title>수업 영상 조작</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 20px; font: 18px/1.5 "Malgun Gothic", sans-serif; background: #f4f5f7; color: #1d1f23; }
  h1 { font-size: 24px; margin: 0; }
  .head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .count { color: #6b7280; font-size: 16px; }
  button { font: inherit; font-weight: bold; border: 0; border-radius: 12px; cursor: pointer; color: #fff; padding: 12px 16px; }
  button:disabled { opacity: .4; cursor: default; }
  .small { background: #e5e7eb; color: #1f2937; padding: 8px 12px; font-size: 16px; border-radius: 10px; }
  #addBtn { background: #2563eb; }
  .filebar { display: flex; align-items: center; gap: 8px; background: #fff; border-radius: 12px; padding: 8px 12px; margin-bottom: 12px; }
  #fileName { flex: 1; min-width: 0; font-weight: bold; color: #4c1d95; overflow-wrap: anywhere; }

  #list { display: flex; flex-direction: column; gap: 10px; }
  .item { display: flex; align-items: center; gap: 12px; background: #fff; border-radius: 14px; padding: 12px; border: 3px solid transparent; }
  .item.active { border-color: #7c3aed; }
  .num { font-size: 22px; font-weight: bold; color: #7c3aed; width: 28px; text-align: center; }
  .info { flex: 1; min-width: 0; }
  .title { font-size: 20px; font-weight: bold; overflow-wrap: anywhere; }
  .meta { font-size: 14px; color: #6b7280; overflow-wrap: anywhere; }
  .playBtn { background: #7c3aed; font-size: 20px; padding: 16px 18px; white-space: nowrap; }
  .tools { display: flex; flex-direction: column; gap: 4px; }
  .tools button { padding: 4px 10px; font-size: 14px; }
  .del { background: #fee2e2 !important; color: #991b1b !important; }
  .empty { background: #fff; border-radius: 14px; padding: 24px; text-align: center; color: #6b7280; }

  #form { display: none; background: #fff; border-radius: 14px; padding: 16px; margin-bottom: 12px; border: 2px solid #2563eb; }
  #form label { display: block; font-size: 15px; color: #374151; margin-top: 8px; }
  #form input { width: 100%; font-size: 18px; padding: 10px; border: 2px solid #c5c9d0; border-radius: 10px; }
  .two { display: flex; gap: 10px; } .two > div { flex: 1; }
  .formBtns { display: flex; gap: 10px; margin-top: 12px; }
  #save { background: #2563eb; flex: 1; } #cancel { background: #6b7280; }

  .controls { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
  .controls button { flex: 1; font-size: 18px; padding: 14px 8px; }
  #play { background: #16a34a; } #pause { background: #ca8a04; } #restart { background: #6b7280; } #stopShare { background: #475569; }
  #back { width: 100%; margin-top: 8px; background: #dc2626; font-size: 22px; padding: 16px; }
  .box { margin-top: 10px; padding: 12px 14px; border-radius: 12px; background: #fff; white-space: pre-line; }
  .error { background: #fee2e2; color: #991b1b; }
  .ok { background: #dcfce7; color: #166534; font-weight: bold; }
  #manual { display: none; font-size: 16px; }
  #manual ol { margin: 6px 0 0; padding-left: 22px; }
</style>
</head>
<body>
<div class="head">
  <h1>수업 영상 <span class="count" id="count"></span></h1>
  <button id="addBtn">+ 영상 등록</button>
</div>
<div class="filebar">
  <div id="fileName">저장 파일: (저장 안 됨)</div>
  <button id="saveFile" class="small">💾 목록 저장</button>
  <button id="openFile" class="small">📂 불러오기</button>
  <button id="resetList" class="small del">🗑 리셋</button>
</div>

<div id="form">
  <b id="formTitle">영상 등록</b>
  <label>영상 이름 (예: 구연동화 1)</label>
  <input id="fTitle" maxlength="60">
  <label>YouTube 주소</label>
  <input id="fUrl" placeholder="https://www.youtube.com/watch?v=...">
  <div class="two">
    <div><label>시작 초 (비우면 처음부터)</label><input id="fStart" type="number" min="0"></div>
    <div><label>종료 초 (비우면 끝까지)</label><input id="fEnd" type="number" min="0"></div>
  </div>
  <label>메모</label>
  <input id="fMemo" maxlength="200">
  <div class="formBtns"><button id="save">저장</button><button id="cancel">취소</button></div>
  <div id="formErr" class="box error" style="display:none"></div>
</div>

<div id="list"></div>

<div class="controls">
  <button id="play" disabled>▶ 재생</button>
  <button id="pause" disabled>❚❚ 일시정지</button>
  <button id="restart" disabled>⟲ 처음부터</button>
  <button id="stopShare">■ 공유 중지</button>
</div>
<button id="back">강의로 복귀 (공유 중지 + 영상 닫기)</button>
<div id="zoom" class="box">Zoom: 공유하지 않음</div>
<div id="status" class="box">목록에서 영상의 [▶ 공유 재생]을 누르세요.</div>
<div id="manual" class="box error">
  <b>수동으로 공유하는 방법</b>
  <ol>
    <li>Zoom 회의 화면 아래 [공유] 버튼을 누릅니다.</li>
    <li>목록에서 <b>ZOOMAUTO PLAYER</b> 창을 고릅니다.</li>
    <li>오른쪽 아래 <b>소리 공유</b>와 <b>비디오 공유에 최적화</b>에 체크합니다.</li>
    <li>[공유]를 누른 뒤 이 앱에서 [▶ 재생]을 누릅니다.</li>
  </ol>
</div>
<script src="app.js"></script>
</body>
</html>
